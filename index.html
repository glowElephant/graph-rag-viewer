<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>GraphRAG Viewer · sigma.js v3</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #050608; color: #e7e9ee;
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      overflow: hidden; }
    #graph { position: absolute; inset: 0; width: 100vw; height: 100vh; }

    .panel {
      position: absolute; padding: 10px 14px; border-radius: 8px;
      background: rgba(12, 14, 18, 0.78); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06); max-width: 360px; z-index: 10;
    }
    #stats { top: 14px; left: 14px; }
    #detail { bottom: 14px; left: 14px; max-height: 40vh; overflow: auto; display: none; }
    #links {
      position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 10;
    }
    .link {
      background: #161922; color: #888; padding: 6px 12px; border-radius: 6px;
      text-decoration: none; font-size: 11px; border: 1px solid rgba(255,255,255,0.06);
    }
    .link:hover { color: #fff; background: #1f2330; }
    .badge {
      display: inline-block; padding: 1px 6px; border-radius: 3px; margin-right: 4px;
      font-size: 10px; font-weight: 600; background: rgba(255,255,255,0.08);
    }
    h3 { margin: 0 0 6px; font-size: 13px; color: #fff; }
    pre { margin: 4px 0; font-size: 11px; line-height: 1.5; white-space: pre-wrap;
      color: #b8bdc7; font-family: inherit; }
    .muted { color: #6a7080; }
  </style>
</head>
<body>
  <div id="graph"></div>

  <div id="stats" class="panel">
    <h3>GraphRAG Viewer</h3>
    <div id="stats-body" class="muted">loading…</div>
  </div>

  <div id="detail" class="panel">
    <h3 id="detail-title"></h3>
    <pre id="detail-body"></pre>
  </div>

  <div id="links">
    <a class="link" href="3d.html">3D ↗</a>
    <a class="link" href="vis.html">legacy ↗</a>
    <a class="link" href="https://github.com/glowElephant/graph-rag-viewer" target="_blank" rel="noopener">repo ↗</a>
  </div>

  <script src="graph-data.js"></script>
  <script type="module">
    // sigma.js v3 + graphology — vanilla WebGL 2D 그래프 표준, 10k+ 노드 검증
    import Graph from "https://esm.sh/graphology@0.25";
    import Sigma from "https://esm.sh/sigma@3";
    import forceAtlas2 from "https://esm.sh/graphology-layout-forceatlas2@0.10";
    import FA2Layout from "https://esm.sh/graphology-layout-forceatlas2@0.10/worker";

    const $stats = document.getElementById('stats-body');
    const $detail = document.getElementById('detail');
    const $detailTitle = document.getElementById('detail-title');
    const $detailBody = document.getElementById('detail-body');
    const container = document.getElementById('graph');

    const t0 = performance.now();

    // graphology 그래프 구축
    const graph = new Graph({ multi: true });
    const validIds = new Set();
    GRAPH_NODES.forEach(n => {
      if (graph.hasNode(n.id)) return;
      validIds.add(n.id);
      graph.addNode(n.id, {
        label: n.label || n.id,
        color: n.color || '#4FC3F7',
        size: Math.max(2, Math.sqrt(n.size || 8) * 0.9),
        // 초기 random 위치 — ForceAtlas2가 펼쳐줌
        x: Math.random() * 100 - 50,
        y: Math.random() * 100 - 50,
        title: n.title || '',
      });
    });
    let skipped = 0;
    GRAPH_EDGES.forEach(e => {
      if (validIds.has(e.from) && validIds.has(e.to)) {
        graph.addEdge(e.from, e.to, {
          color: e.color || 'rgba(120,140,180,0.25)',
          size: 0.5,
        });
      } else {
        skipped++;
      }
    });

    $stats.innerHTML =
      `<span class="badge">${graph.order}</span> nodes ` +
      `<span class="badge">${graph.size}</span> edges<br>` +
      `<span class="muted">layouting (ForceAtlas2)…</span>`;

    setTimeout(() => {
      // 1) 초기 빠른 펼치기 (정적 60 iter)
      forceAtlas2.assign(graph, {
        iterations: 60,
        settings: {
          gravity: 1, scalingRatio: 10, slowDown: 4,
          barnesHutOptimize: true, barnesHutTheta: 0.6,
        },
      });

      // 2) Sigma 렌더러
      const renderer = new Sigma(graph, container, {
        renderEdgeLabels: false,
        defaultEdgeColor: 'rgba(120,140,180,0.25)',
        labelColor: { color: '#aaa' },
        labelSize: 11,
        labelWeight: '400',
        renderLabels: true,
        labelRenderedSizeThreshold: 8,
        zIndex: true,
        minCameraRatio: 0.05,
        maxCameraRatio: 10,
      });

      // 3) Web Worker로 continuous simulation — 노드들이 살아 움직임
      const layout = new FA2Layout(graph, {
        settings: {
          gravity: 1, scalingRatio: 10, slowDown: 8,
          barnesHutOptimize: true, barnesHutTheta: 0.6,
        },
      });
      layout.start();

      // 노드 클릭 → detail
      renderer.on('clickNode', ({ node }) => {
        const attrs = graph.getNodeAttributes(node);
        $detailTitle.textContent = attrs.label;
        $detailBody.textContent = attrs.title || '(no description)';
        $detail.style.display = 'block';
      });
      renderer.on('clickStage', () => { $detail.style.display = 'none'; });

      // 4) 노드 drag — drag 중엔 worker 일시 정지
      let dragged = null;
      renderer.on('downNode', ({ node }) => {
        dragged = node;
        graph.setNodeAttribute(node, 'highlighted', true);
        layout.stop();
      });
      const captor = renderer.getMouseCaptor();
      captor.on('mousemovebody', (e) => {
        if (!dragged) return;
        const pos = renderer.viewportToGraph(e);
        graph.setNodeAttribute(dragged, 'x', pos.x);
        graph.setNodeAttribute(dragged, 'y', pos.y);
        e.preventSigmaDefault?.();
        e.original?.preventDefault?.();
        e.original?.stopPropagation?.();
      });
      const release = () => {
        if (dragged) {
          graph.removeNodeAttribute(dragged, 'highlighted');
          dragged = null;
          layout.start();
        }
      };
      captor.on('mouseup', release);
      captor.on('mouseleave', release);

      // 5) Play/Pause 토글 + 30초 후 자동 정지 (CPU 절약)
      let autoStopped = false;
      setTimeout(() => {
        if (!autoStopped && layout.isRunning()) {
          layout.stop();
          autoStopped = true;
          $stats.querySelector('.muted').textContent =
            'simulation paused (30s elapsed). press space to resume.';
        }
      }, 30000);
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          if (layout.isRunning()) { layout.stop(); }
          else { layout.start(); autoStopped = false; }
        }
      });

      const elapsed = (performance.now() - t0).toFixed(0);
      $stats.innerHTML =
        `<span class="badge">${graph.order}</span> nodes ` +
        `<span class="badge">${graph.size}</span> edges<br>` +
        `<span class="muted">sigma.js · ${elapsed}ms · drag/wheel · click node · space=pause/play</span>`;
      window.__sigma = renderer;
      window.__layout = layout;
    }, 0);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') $detail.style.display = 'none';
    });
  </script>
</body>
</html>
