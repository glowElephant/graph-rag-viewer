<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>GraphRAG Viewer · Cosmograph</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #050608; color: #e7e9ee;
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    #graph { position: absolute; inset: 0; }

    .panel {
      position: absolute; padding: 10px 14px; border-radius: 8px;
      background: rgba(12, 14, 18, 0.78); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06); max-width: 360px;
    }
    #stats { top: 14px; left: 14px; }
    #detail { bottom: 14px; left: 14px; max-height: 40vh; overflow: auto; display: none; }
    #links { top: 14px; right: 14px; display: flex; gap: 8px; }
    .link {
      background: #161922; color: #888; padding: 6px 12px; border-radius: 6px;
      text-decoration: none; font-size: 11px; border: 1px solid rgba(255,255,255,0.06);
    }
    .link:hover { color: #fff; background: #1f2330; }
    .badge {
      display: inline-block; padding: 1px 6px; border-radius: 3px; margin-right: 4px;
      font-size: 10px; font-weight: 600; background: rgba(255,255,255,0.08);
    }
    h3 { margin: 0 0 6px; font-size: 13px; color: #fff; }
    pre { margin: 4px 0; font-size: 11px; line-height: 1.5; white-space: pre-wrap;
      color: #b8bdc7; font-family: inherit; }
    .muted { color: #6a7080; }
  </style>
</head>
<body>
  <div id="graph"></div>

  <div id="stats" class="panel">
    <h3>GraphRAG Viewer</h3>
    <div id="stats-body" class="muted">loading…</div>
  </div>

  <div id="detail" class="panel">
    <h3 id="detail-title"></h3>
    <pre id="detail-body"></pre>
  </div>

  <div id="links">
    <a class="link" href="3d.html">3D ↗</a>
    <a class="link" href="vis.html">legacy ↗</a>
    <a class="link" href="https://github.com/glowElephant/graph-rag-viewer" target="_blank" rel="noopener">repo ↗</a>
  </div>

  <script src="graph-data.js"></script>
  <script type="module">
    import { Cosmograph } from "https://esm.sh/@cosmograph/cosmograph";

    const $stats = document.getElementById('stats-body');
    const $detail = document.getElementById('detail');
    const $detailTitle = document.getElementById('detail-title');
    const $detailBody = document.getElementById('detail-body');

    const t0 = performance.now();

    // vis-network 형식 → Cosmograph 형식
    const nodes = GRAPH_NODES.map(n => ({
      id: n.id,
      label: n.label,
      color: n.color || '#4FC3F7',
      sz: Math.max(2, Math.sqrt(n.size || 8) * 1.1),
      title: n.title || '',
    }));
    const links = GRAPH_EDGES.map(e => ({
      source: e.from,
      target: e.to,
      color: e.color || 'rgba(120,140,180,0.35)',
      label: e.label || '',
    }));

    const tParse = (performance.now() - t0).toFixed(0);
    $stats.innerHTML =
      `<span class="badge">${nodes.length}</span> nodes ` +
      `<span class="badge">${links.length}</span> edges<br>` +
      `<span class="muted">parsed in ${tParse}ms · initializing GPU…</span>`;

    const container = document.getElementById('graph');

    const graph = new Cosmograph(container, {
      nodes,
      links,
      nodeColor: n => n.color,
      nodeSize: n => n.sz,
      linkColor: l => l.color,
      linkWidth: 0.4,
      linkArrows: false,
      backgroundColor: '#050608',

      // simulation tuning — 9.5k nodes / 24k edges에 맞춤
      simulationRepulsion: 0.5,
      simulationLinkSpring: 1.2,
      simulationLinkDistance: 6,
      simulationGravity: 0.15,
      simulationFriction: 0.88,
      simulationDecay: 1500,

      // labels: 너무 많이 그리면 느려져서 상위 N개 + hover만
      showDynamicLabels: true,
      showTopLabels: true,
      showTopLabelsLimit: 30,
      nodeLabelAccessor: n => n.label,

      onClick: (node) => {
        if (!node) { $detail.style.display = 'none'; return; }
        $detailTitle.textContent = node.label;
        $detailBody.textContent = node.title || '(no description)';
        $detail.style.display = 'block';
      },
    });

    setTimeout(() => {
      const elapsed = (performance.now() - t0).toFixed(0);
      $stats.innerHTML =
        `<span class="badge">${nodes.length}</span> nodes ` +
        `<span class="badge">${links.length}</span> edges<br>` +
        `<span class="muted">GPU · ready in ${elapsed}ms · click any node</span>`;
    }, 2500);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') $detail.style.display = 'none';
    });
  </script>
</body>
</html>
